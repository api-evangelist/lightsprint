- name: Repo
  description: Codebase bound to a workspace; the unit tasks are created against.
  id_field: repo.id
  evidence: GET /api/repo-key/info returns `repo.id`; tasks are created at
    POST /api/repos/{repoId}/tasks
  relationships:
