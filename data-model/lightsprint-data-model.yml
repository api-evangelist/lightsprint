dependency_semantics:
  note: >-
    Lightsprint's dependency direction is documented explicitly and is the inverse of
    some common phrasing: a PARENT task DEPENDS ON its listed dependencies, and those
    dependencies are the CHILD / prerequisite tasks that must complete first.
  equivalences:
    depends_on: [blocked by, requires, has prerequisites]
    dependency: [prerequisite, child task]
    dependent: [parent task, root task]
