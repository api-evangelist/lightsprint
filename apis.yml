aid: lightsprint
name: Lightsprint
description: >-
  Lightsprint is an AI-native product-development platform where developers, product
  managers, and designers plan, build, and ship together against a codebase a team
  already runs, rather than a greenfield prototype. Its three surfaces are Plan Mode,
  which turns plain-English requirements into structured, reviewable visual plans;
  infinite parallel cloud agents that execute those plans on the team's real repository
  using Anthropic, Cursor, or Codex models in managed cloud infrastructure instead of on
  a developer's machine; and per-change preview environments that give every pull
  request a live URL so non-engineers review a running app instead of a diff. Work is
  tracked on a workspace board of stacks, projects, tasks, and dependencies exposed
  through an OAuth 2.0 REST API, a `lightsprint` CLI, a set of published Claude Code
  Agent Skills, and an n8n community node. Lightsprint was founded by Ben Ong, Benedict
  Chan, and Heng Hong Lee, and went through Y Combinator's Spring 2026 batch.
