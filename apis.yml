apis:
- aid: lightsprint:lightsprint-api
  name: Lightsprint API
  description: >-
    REST API over the Lightsprint workspace board — tasks, comments, projects, stacks,
    and cloud coding agents. Authenticated with OAuth 2.0 authorization-code tokens
    bound to a single workspace; the repo id is resolved server-side from the token.
    Lightsprint does not publish an OpenAPI document or an API reference page, so this
    entry is grounded in the provider's own published client source (the n8n community
    node and the Claude Code plugin).
